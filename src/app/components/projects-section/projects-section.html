<section id="projects" class="projects-section">
  <div class="container">
    <div class="section-heading">
      <div>
        <p class="eyebrow">04 — Selected work</p>
        <h2>Một vài dự án tiêu biểu</h2>
      </div>
      <p class="section-intro">Từ hạ tầng mạng đến nền tảng đám mây và ứng dụng AI.</p>
    </div>

    <div class="filter-buttons" aria-label="Lọc dự án">
      <button [class.active]="selectedCategory === 'all'" [attr.aria-pressed]="selectedCategory === 'all'" (click)="filterCategory('all')">Tất cả</button>
      <button [class.active]="selectedCategory === 'network'" [attr.aria-pressed]="selectedCategory === 'network'" (click)="filterCategory('network')">Mạng</button>
      <button [class.active]="selectedCategory === 'cloud'" [attr.aria-pressed]="selectedCategory === 'cloud'" (click)="filterCategory('cloud')">Cloud</button>
      <button [class.active]="selectedCategory === 'ai'" [attr.aria-pressed]="selectedCategory === 'ai'" (click)="filterCategory('ai')">AI</button>
    </div>

    <div class="projects-grid">
      @for (project of filteredProjects; track project.title; let index = $index) {
        <app-project-card
          [project]="project"
          [index]="index + 1"
          (previewImage)="openLightbox($event)">
        </app-project-card>
      }
    </div>
  </div>

  @if (activeModal) {
    <div class="lightbox-backdrop" (click)="closeLightbox()" role="dialog" aria-modal="true" aria-label="Phóng to sơ đồ">
      <div class="lightbox-content" (click)="$event.stopPropagation()">
        <div class="lightbox-header">
          <span class="lightbox-title">{{ activeModal.title }}</span>
          <button type="button" class="lightbox-close" (click)="closeLightbox()" aria-label="Đóng cửa sổ">✕</button>
        </div>
        <div class="lightbox-image-wrapper">
          <img [src]="activeModal.url" [alt]="activeModal.title" class="lightbox-img" />
        </div>
        <div class="lightbox-caption">
          <span>Sơ đồ kiến trúc / Triển khai hệ thống thực tế</span>
        </div>
      </div>
    </div>
  }
</section>
